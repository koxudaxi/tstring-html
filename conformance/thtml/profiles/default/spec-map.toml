note = "Float component return values render as escaped text."

[[cases]]
case_id = "component-return-bool"
spec_ref = "v1.thtml.component-return-bool"
operation = "render_html"
expected = "true"
execution_layer = "python"
note = "Bool component return values render as escaped text using renderer scalar stringification."

[[cases]]
case_id = "nested-components"
spec_ref = "v1.thtml.nested-components"
operation = "render_html"
expected = "<div class=\"card\"><h2>Status</h2><span class=\"badge\">new</span></div>"
execution_layer = "python"
note = "Components can nest inside other components."

[[cases]]
case_id = "component-auto-wrap-template"
spec_ref = "v1.thtml.component-auto-wrap-template"
operation = "render_html"
expected = "<div class=\"card\"><h2>Status</h2><div class=\"body\"><span class=\"badge badge-success\">active</span></div></div>"
execution_layer = "python"
note = "Decorated components may return Template values and are auto-wrapped into deferred Renderable output."

[[cases]]
case_id = "component-explicit-renderable-wrap"
spec_ref = "v1.thtml.component-explicit-renderable-wrap"
operation = "render_html"
expected = "<span class=\"badge badge-success\">active</span>"
execution_layer = "python"
note = "Components may explicitly return thtml(...) renderables instead of relying on decorator auto-wrap."

[[cases]]
case_id = "renderable-captures-scope"
spec_ref = "v1.thtml.renderable-captured-scope"
operation = "render_html"
expected = "<span>captured</span>"
execution_layer = "python"
note = "thtml(...) captures the immediate caller scope at construction time and can be rendered later."

[[cases]]
case_id = "renderable-scope-frozen"
spec_ref = "v1.thtml.renderable-frozen-scope"
operation = "render_html"
expected = "<span>captured</span>"
execution_layer = "python"
note = "A captured T-HTML Renderable keeps its original component bindings even after names are rebound."

[[cases]]
case_id = "renderable-ignores-later-overrides"
spec_ref = "v1.thtml.renderable-frozen-scope-overrides"
operation = "render_html"
expected = "<span>captured</span>"
execution_layer = "python"
note = "Rendering an existing Renderable ignores later globals/locals overrides and uses captured scope."

[[cases]]
case_id = "component-return-string-is-text"
spec_ref = "v1.thtml.component-return-string-is-text"
operation = "render_html"
expected = "&lt;b&gt;unsafe&lt;/b&gt;"
execution_layer = "python"
note = "Plain string component return values are still escaped text, not raw HTML."

[[cases]]
case_id = "auto-wrap-uses-defining-globals"
spec_ref = "v1.thtml.component-auto-wrap-defining-globals"
operation = "render_html"
expected = "<span class=\"badge badge-info\">ok</span>"
execution_layer = "python"
note = "Auto-wrapped Template return values resolve nested tags from the component's defining module globals."

[[cases]]
case_id = "html-renderable-inside-thtml"
spec_ref = "v1.thtml.cross-backend-renderable-child"
operation = "render_html"
expected = "<strong>active</strong>"
execution_layer = "python"
note = "An HTML Renderable can be embedded inside T-HTML as trusted child HTML."

[[cases]]
case_id = "compiled-render-scope-per-call"
spec_ref = "v1.thtml.compiled-render-scope"
operation = "compile_render"
expected = "<strong tone=\"info\">Two</strong>"
execution_layer = "python"
note = "Compiled T-HTML templates use the globals/locals passed to each render call instead of caching component bindings."

[[cases]]
case_id = "partial-scope-globals-only"
spec_ref = "v1.thtml.partial-scope-globals"
operation = "render_html"
expected = "<span>g</span>"
execution_layer = "python"
