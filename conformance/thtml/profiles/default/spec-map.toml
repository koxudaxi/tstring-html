spec_ref = "v1.thtml.component-return-list"
operation = "render_html"
expected = "<section>Save</section>"
execution_layer = "python"
note = "Components may return iterables that flatten into output."

[[cases]]
case_id = "component-return-none"
spec_ref = "v1.thtml.component-return-none"
operation = "render_html"
expected = ""
execution_layer = "python"
note = "Components may return None for empty output."

[[cases]]
case_id = "component-return-scalar"
spec_ref = "v1.thtml.component-return-scalar"
