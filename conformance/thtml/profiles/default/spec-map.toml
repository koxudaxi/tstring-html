spec_title = "tstring-html v1 T-HTML"
claim_status = "100%"

[provenance]
source = "repo-local v1 T-HTML contract"
snapshot = "2026-03-22"

[[cases]]
case_id = "component-basic-caller-scope"
spec_ref = "v1.thtml.component-caller-scope"
operation = "render_html"
expected = "<button kind=\"primary\">Save</button>"
execution_layer = "python"
note = "PascalCase components resolve from caller scope."

[[cases]]
case_id = "component-explicit-scope"
spec_ref = "v1.thtml.component-explicit-scope"
operation = "render_html"
expected = "<button kind=\"secondary\">Save</button>"
execution_layer = "python"
note = "Explicit globals/locals override frame lookup."

[[cases]]
case_id = "locals-over-globals"
spec_ref = "v1.thtml.locals-over-globals"
operation = "render_html"
expected = "<button kind=\"local\">Save</button>"
execution_layer = "python"
note = "locals take precedence over globals during component resolution."

[[cases]]
case_id = "missing-component"
spec_ref = "v1.thtml.component-missing"
operation = "render_html"
expected_error = "TemplateRuntimeError"
execution_layer = "python"
note = "Missing component lookup is a runtime resolution error."

[[cases]]
case_id = "non-callable-component"
spec_ref = "v1.thtml.component-non-callable"
operation = "render_html"
expected_error = "TemplateRuntimeError"
execution_layer = "python"
note = "Resolved components must be callable."

[[cases]]
case_id = "component-spread"
spec_ref = "v1.thtml.component-spread"
operation = "render_html"
expected = "<button kind=\"secondary\">Save</button>"
execution_layer = "python"
note = "Spread attrs merge into component props."

[[cases]]
case_id = "component-class-spread"
spec_ref = "v1.thtml.component-class-spread"
operation = "render_html"
expected = "<button kind=\"primary\" class=\"button button--primary\">Save</button>"
execution_layer = "python"
note = "Class spread values normalize and preserve truthy mapping keys."

[[cases]]
case_id = "component-spread-override"
spec_ref = "v1.thtml.component-spread-override"
operation = "render_html"
expected = "<button kind=\"secondary\">Save</button>"
execution_layer = "python"
note = "Later spread props override earlier explicit component props."

[[cases]]
case_id = "html-element-attr-merge"
spec_ref = "v1.thtml.html-element-attrs"
operation = "render_html"
expected = "<div class=\"base extra active tail\" data-id=\"2\">content</div>"
execution_layer = "python"
note = "HTML elements inside T-HTML follow the same attr/class/spread rules as HTML."

[[cases]]
case_id = "component-prop-html-names"
spec_ref = "v1.thtml.component-prop-html-names"
operation = "render_html"
expected = "primary|Save button|Save"
