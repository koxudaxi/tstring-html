note = "Component props keep their HTML-facing names such as class and aria-label."

[[cases]]
case_id = "component-spread-non-mapping"
spec_ref = "v1.thtml.component-spread-type"
operation = "render_html"
expected_error = "TemplateRuntimeError"
execution_layer = "python"
note = "Non-mapping component spread values are rejected."

[[cases]]
case_id = "children-raw-html"
