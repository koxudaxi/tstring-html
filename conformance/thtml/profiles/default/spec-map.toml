[[cases]]
case_id = "partial-scope-locals-only"
spec_ref = "v1.thtml.partial-scope-locals"
operation = "render_html"
expected = "<span>l</span>"
execution_layer = "python"
note = "Providing locals= only still captures caller globals from the immediate frame."

