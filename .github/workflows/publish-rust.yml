name: Publish Rust Crates

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish. Leave empty when running on a tag ref."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rust-${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      tag_name: ${{ steps.resolve.outputs.tag_name }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="${INPUT_VERSION}"
          tag_name=""
          if [ -z "$version" ]; then
            if [ -n "$RELEASE_TAG" ]; then
              version="$RELEASE_TAG"
              tag_name="$RELEASE_TAG"
            elif [ "$REF_TYPE" = "tag" ]; then
              version="$REF_NAME"
              tag_name="$REF_NAME"
            else
              printf '%s\n' "Set the version input, publish a GitHub Release, or run this workflow on a tag ref." >&2
              exit 1
            fi
          fi

          version="${version#refs/tags/}"
          version="${version#v}"
          version="${version#V}"
          if [[ "$version" == *$'\n'* || "$version" == *$'\r'* || ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            printf '%s\n' "Expected semantic version like 0.1.0." >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ -n "$tag_name" ]; then
            tag_name="${tag_name#refs/tags/}"
            echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          fi

  version-check:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Validate lockstep versions against tag
        run: |
          python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"
          python3 scripts/manage_versions.py check --tag "${{ needs.resolve-version.outputs.version }}"

  package-check:
    needs: [resolve-version, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify Rust crates package cleanly
        run: cargo package --allow-dirty --manifest-path rust/Cargo.toml -p tstring-format-doc -p tstring-html -p tstring-tdom -p tstring-thtml

  publish-format-doc:
    needs: [resolve-version, package-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Publish tstring-format-doc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-format-doc

  publish-html:
    needs: [resolve-version, publish-format-doc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-format-doc to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-format-doc

      - name: Publish tstring-html
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-html

  publish-tdom:
    needs: [resolve-version, publish-format-doc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-format-doc to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-format-doc

      - name: Publish tstring-tdom
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-tdom

  publish-thtml:
    needs: [resolve-version, publish-html]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-html to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-html

      - name: Publish tstring-thtml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-thtml
