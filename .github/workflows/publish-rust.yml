name: Publish Rust Crates

on:
  push:
    tags:
      - "**"

permissions:
  contents: read

env:
  RELEASE_VERSION: ${{ github.ref_name }}

concurrency:
  group: publish-rust-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  version-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate lockstep versions against tag
        run: |
          python3 scripts/manage_versions.py set "${{ env.RELEASE_VERSION }}"
          python3 scripts/manage_versions.py check --tag "${{ env.RELEASE_VERSION }}"

  package-check:
    needs: version-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ env.RELEASE_VERSION }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify Rust crates package cleanly
        run: cargo package --allow-dirty --manifest-path rust/Cargo.toml -p tstring-html -p tstring-thtml

  publish-html:
    needs: package-check
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ env.RELEASE_VERSION }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Publish tstring-html
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-html

  publish-thtml:
    needs: publish-html
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ env.RELEASE_VERSION }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-html to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-html

      - name: Publish tstring-thtml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-thtml
