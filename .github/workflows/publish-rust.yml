name: Publish Rust Crates

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish. Leave empty when running on a tag ref."
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: publish-rust-${{ github.event.release.tag_name || github.event.inputs.version || github.ref_name }}
  cancel-in-progress: false

jobs:
  resolve-version:
    uses: ./.github/workflows/resolve-release-version.yml
    with:
      version: ${{ github.event.inputs.version || '' }}
      release_tag: ${{ github.event.release.tag_name || '' }}
      ref_name: ${{ github.ref_name }}
      ref_type: ${{ github.ref_type }}

  version-check:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Validate lockstep versions against tag
        run: |
          python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"
          python3 scripts/manage_versions.py check --tag "${{ needs.resolve-version.outputs.version }}"

  package-check:
    needs: [resolve-version, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Verify Rust crates package cleanly
        run: cargo package --allow-dirty --manifest-path rust/Cargo.toml -p tstring-format-doc -p tstring-html -p tstring-tdom -p tstring-thtml

  publish-format-doc:
    needs: [resolve-version, package-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Publish tstring-format-doc
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-format-doc

  publish-html:
    needs: [resolve-version, publish-format-doc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-format-doc to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-format-doc

      - name: Publish tstring-html
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-html

  publish-tdom:
    needs: [resolve-version, publish-format-doc]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-format-doc to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-format-doc

      - name: Publish tstring-tdom
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-tdom

  publish-thtml:
    needs: [resolve-version, publish-html]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: crates-io
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release tag
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Wait for tstring-html to appear on crates.io
        run: python3 .github/scripts/wait_for_crate.py tstring-html

      - name: Publish tstring-thtml
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish --allow-dirty --manifest-path rust/Cargo.toml -p tstring-thtml
