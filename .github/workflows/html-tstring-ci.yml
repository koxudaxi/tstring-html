name: html-tstring CI

on:
  workflow_dispatch:
  push:
    paths:
      - ".github/workflows/html-tstring-ci.yml"
      - "conformance/**"
      - "examples/**"
      - "html-tstring/**"
      - "rust/**"
      - "tests/**"
  pull_request:
    paths:
      - ".github/workflows/html-tstring-ci.yml"
      - "conformance/**"
      - "examples/**"
      - "html-tstring/**"
      - "rust/**"
      - "tests/**"

jobs:
  checks:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Sync development dependencies
        run: uv sync --group dev

      - name: Configure PyO3 test environment
        shell: bash
        run: |
          PYTHON_BIN="$(uv run --group dev python - <<'PY'
          import sys
          print(sys.executable)
          PY
          )"
          echo "PYO3_PYTHON=$PYTHON_BIN" >> "$GITHUB_ENV"

      - name: Check formatting
        run: uv run ruff format --check html-tstring tests examples

      - name: Run lint
        run: uv run ruff check html-tstring tests examples

      - name: Run html-tstring tests
        run: uv run pytest html-tstring/tests tests/test_examples.py -q

      - name: Run Rust HTML tests
        run: cargo test --manifest-path rust/Cargo.toml -p tstring-html -p tstring-html-backend-e2e-tests --tests
