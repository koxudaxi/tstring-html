name: Publish Python Packages

on:
  push:
    tags:
      - "**"
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish. Leave empty when running on a tag ref."
        required: false
        type: string

permissions:
  contents: read

jobs:
  resolve-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
    steps:
      - name: Resolve release version
        id: resolve
        shell: bash
        env:
          INPUT_VERSION: ${{ github.event.inputs.version }}
          REF_NAME: ${{ github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          version="${INPUT_VERSION}"
          if [ -z "$version" ]; then
            if [ "$REF_TYPE" = "tag" ]; then
              version="$REF_NAME"
            else
              echo "::error::Set the version input or run this workflow on a tag ref."
              exit 1
            fi
          fi
          version="${version#refs/tags/}"
          version="${version#v}"
          version="${version#V}"
          echo "version=$version" >> "$GITHUB_OUTPUT"

  version-check:
    needs: resolve-version
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Validate lockstep versions against release
        run: |
          python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"
          python3 scripts/manage_versions.py check --tag "${{ needs.resolve-version.outputs.version }}"

  build-package:
    needs: [resolve-version, version-check]
    strategy:
      matrix:
        package_path: [html-tstring, thtml-tstring]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync lockstep versions to release version
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build distribution
        run: uv build "${{ matrix.package_path }}" --out-dir dist

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.package_path }}
          path: dist/*

  build-bindings-wheels:
    needs: [resolve-version, version-check]
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync lockstep versions to release version
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Build bindings wheel (Linux manylinux)
        if: ${{ matrix.os == 'linux' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path rust/tstring-html-bindings/Cargo.toml --out dist --compatibility pypi -i python3.14
          manylinux: "2_28"
          sccache: "true"

      - name: Build bindings wheel (host)
        if: ${{ matrix.os != 'linux' }}
        shell: bash
        run: |
          PYTHON_BIN="$(uv run --python 3.14 python - <<'PY'
          import sys
          print(sys.executable)
          PY
          )"
          uvx maturin build --release --manifest-path rust/tstring-html-bindings/Cargo.toml --out dist --compatibility pypi -i "$PYTHON_BIN"

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: bindings-wheels-${{ matrix.os }}
          path: dist/*

  build-bindings-sdist:
    needs: [resolve-version, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Sync lockstep versions to release version
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build bindings sdist
        run: uvx maturin sdist --manifest-path rust/tstring-html-bindings/Cargo.toml --out dist

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: bindings-sdist
          path: dist/*

  publish-bindings:
    needs: [build-bindings-wheels, build-bindings-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: tstring-html-bindings-pypi
    steps:
      - name: Download bindings wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-wheels-*
          merge-multiple: false
          path: dist

      - name: Download bindings sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-sdist
          path: dist

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload

  publish-html-tstring:
    needs: [build-package, publish-bindings]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: html-tstring-pypi
    steps:
      - name: Download html-tstring artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-html-tstring
          path: dist

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;

      - name: Publish html-tstring distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload

  publish-thtml-tstring:
    needs: [build-package, publish-bindings]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: thtml-tstring-pypi
    steps:
      - name: Download thtml-tstring artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-thtml-tstring
          path: dist

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;

      - name: Publish thtml-tstring distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
