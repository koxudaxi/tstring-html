name: Publish Python Packages

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: "Release version to publish. Leave empty when running on a tag ref."
        required: false
        type: string
      target:
        description: "Package target to publish"
        required: true
        default: all
        type: choice
        options:
          - all
          - bindings
          - html-tstring
          - thtml-tstring

permissions:
  contents: read

jobs:
  resolve-version:
    uses: ./.github/workflows/resolve-release-version.yml
    with:
      version: ${{ github.event.inputs.version || '' }}
      release_tag: ${{ github.event.release.tag_name || '' }}
      ref_name: ${{ github.ref_name }}
      ref_type: ${{ github.ref_type }}

  resolve-target:
    runs-on: ubuntu-latest
    outputs:
      target: ${{ steps.resolve.outputs.target }}
    steps:
      - name: Resolve publish target
        id: resolve
        shell: bash
        env:
          INPUT_TARGET: ${{ github.event.inputs.target }}
          RELEASE_TAG: ${{ github.event.release.tag_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          target="${INPUT_TARGET}"
          if [ -z "$target" ]; then
            if [ -n "$RELEASE_TAG" ] || [ "$REF_TYPE" = "tag" ]; then
              target="all"
            else
              printf '%s\n' "Set the target input, publish a GitHub Release, or run this workflow on a tag ref." >&2
              exit 1
            fi
          fi

          case "$target" in
            all|bindings|html-tstring|thtml-tstring) ;;
            *)
              printf '%s\n' "Unsupported target." >&2
              exit 1
              ;;
          esac

          echo "target=$target" >> "$GITHUB_OUTPUT"

  version-check:
    needs: [resolve-version, resolve-target]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Validate lockstep versions against release
        run: |
          python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"
          python3 scripts/manage_versions.py check --tag "${{ needs.resolve-version.outputs.version }}"

  build-package:
    needs: [resolve-version, resolve-target, version-check]
    strategy:
      matrix:
        package_path: [html-tstring, thtml-tstring]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.resolve-target.outputs.target != 'bindings' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release version
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Build distribution
        run: uv build "${{ matrix.package_path }}" --out-dir dist

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: python-distributions-${{ matrix.package_path }}
          path: dist/*

  build-bindings-wheels:
    needs: [resolve-version, resolve-target, version-check]
    strategy:
      matrix:
        include:
          - os: linux
            runner: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: macos
            runner: macos-14
            target: aarch64-apple-darwin
          - os: windows
            runner: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
    if: ${{ needs.resolve-target.outputs.target == 'all' || needs.resolve-target.outputs.target == 'bindings' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release version
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}

      - name: Build bindings wheel (Linux manylinux)
        if: ${{ matrix.os == 'linux' }}
        uses: PyO3/maturin-action@v1
        with:
          target: ${{ matrix.target }}
          args: --release --manifest-path rust/tstring-html-bindings/Cargo.toml --out dist --compatibility pypi -i python3.14
          manylinux: "2_28"
          sccache: "true"

      - name: Build bindings wheel (host)
        if: ${{ matrix.os != 'linux' }}
        shell: bash
        run: |
          PYTHON_BIN="$(uv run --python 3.14 python - <<'PY'
          import sys
          print(sys.executable)
          PY
          )"
          uvx maturin build --release --manifest-path rust/tstring-html-bindings/Cargo.toml --out dist --compatibility pypi -i "$PYTHON_BIN"

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: bindings-wheels-${{ matrix.os }}
          path: dist/*

  build-bindings-sdist:
    needs: [resolve-version, resolve-target, version-check]
    runs-on: ubuntu-latest
    permissions:
      contents: read
    if: ${{ needs.resolve-target.outputs.target == 'all' || needs.resolve-target.outputs.target == 'bindings' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.resolve-version.outputs.tag_name || github.ref }}
          persist-credentials: false

      - name: Sync lockstep versions to release version
        run: python3 scripts/manage_versions.py set "${{ needs.resolve-version.outputs.version }}"

      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.14"

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@1.94.0

      - name: Build bindings sdist
        run: uvx maturin sdist --manifest-path rust/tstring-html-bindings/Cargo.toml --out dist

      - name: Check distribution metadata
        run: uvx twine check dist/*

      - name: Upload distributions
        uses: actions/upload-artifact@v4
        with:
          name: bindings-sdist
          path: dist/*

  publish-bindings:
    needs: [build-bindings-wheels, build-bindings-sdist]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: tstring-html-bindings-pypi
    if: ${{ needs.build-bindings-wheels.result == 'success' && needs.build-bindings-sdist.result == 'success' }}
    steps:
      - name: Download bindings wheel artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: bindings-wheels-*
          merge-multiple: false
          path: dist

      - name: Download bindings sdist artifact
        uses: actions/download-artifact@v4
        with:
          name: bindings-sdist
          path: dist

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;

      - name: Publish distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          skip-existing: true
          verbose: true

  publish-html-tstring:
    needs: [resolve-target, build-package, publish-bindings]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: html-tstring-pypi
    if: |
      always() &&
      needs.build-package.result == 'success' &&
      (
        needs.publish-bindings.result == 'success' ||
        needs.publish-bindings.result == 'skipped'
      ) &&
      (
        needs.resolve-target.outputs.target == 'all' ||
        needs.resolve-target.outputs.target == 'html-tstring'
      )
    steps:
      - name: Download html-tstring artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-html-tstring
          path: dist

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;

      - name: Publish html-tstring distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          skip-existing: true
          verbose: true

  publish-thtml-tstring:
    needs: [resolve-target, build-package, publish-bindings]
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    environment:
      name: thtml-tstring-pypi
    if: |
      always() &&
      needs.build-package.result == 'success' &&
      (
        needs.publish-bindings.result == 'success' ||
        needs.publish-bindings.result == 'skipped'
      ) &&
      (
        needs.resolve-target.outputs.target == 'all' ||
        needs.resolve-target.outputs.target == 'thtml-tstring'
      )
    steps:
      - name: Download thtml-tstring artifact
        uses: actions/download-artifact@v4
        with:
          name: python-distributions-thtml-tstring
          path: dist

      - name: Flatten artifact tree
        shell: bash
        run: |
          mkdir -p upload
          find dist -type f \( -name '*.whl' -o -name '*.tar.gz' \) -exec cp {} upload/ \;

      - name: Publish thtml-tstring distributions
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: upload
          skip-existing: true
          verbose: true
